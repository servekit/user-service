      - USER_SERVICE_OAUTH_GITHUB_CLIENT_ID=${USER_SERVICE_OAUTH_GITHUB_CLIENT_ID:-}
      - USER_SERVICE_OAUTH_GITHUB_CLIENT_SECRET=${USER_SERVICE_OAUTH_GITHUB_CLIENT_SECRET:-}
