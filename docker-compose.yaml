      - USER_SERVICE_RATE_LIMIT_LOGIN_GLOBAL_WINDOW=${USER_SERVICE_RATE_LIMIT_LOGIN_GLOBAL_WINDOW:-}
      - USER_SERVICE_RATE_LIMIT_LOGIN_PREFIX=${USER_SERVICE_RATE_LIMIT_LOGIN_PREFIX:-}
      - USER_SERVICE_RBAC_GROUP_ROLES_PREFIX=${USER_SERVICE_RBAC_GROUP_ROLES_PREFIX:-user:rbac:group_roles}
      - USER_SERVICE_RBAC_GROUP_ROLES_TTL=${USER_SERVICE_RBAC_GROUP_ROLES_TTL:-30m}
      - USER_SERVICE_RBAC_GROUP_USER_PERMS_PREFIX=${USER_SERVICE_RBAC_GROUP_USER_PERMS_PREFIX:-user:rbac:group_user_perms}
      - USER_SERVICE_RBAC_GROUP_USER_PERMS_TTL=${USER_SERVICE_RBAC_GROUP_USER_PERMS_TTL:-10m}
      - USER_SERVICE_RBAC_ROLE_PERMS_PREFIX=${USER_SERVICE_RBAC_ROLE_PERMS_PREFIX:-user:rbac:role_perms}
      - USER_SERVICE_RBAC_ROLE_PERMS_TTL=${USER_SERVICE_RBAC_ROLE_PERMS_TTL:-30m}
      - USER_SERVICE_RBAC_USER_PERMS_PREFIX=${USER_SERVICE_RBAC_USER_PERMS_PREFIX:-user:rbac:user_perms}
      - USER_SERVICE_RBAC_USER_PERMS_TTL=${USER_SERVICE_RBAC_USER_PERMS_TTL:-10m}
      - USER_SERVICE_RBAC_USER_ROLES_PREFIX=${USER_SERVICE_RBAC_USER_ROLES_PREFIX:-user:rbac:user_roles}
      - USER_SERVICE_RBAC_USER_ROLES_TTL=${USER_SERVICE_RBAC_USER_ROLES_TTL:-10m}
      - USER_SERVICE_SERVER_GRPC=${USER_SERVICE_SERVER_GRPC:-:19094}
      - USER_SERVICE_SESSION_CODE_TTL=${USER_SERVICE_SESSION_CODE_TTL:-5m}
      - USER_SERVICE_SESSION_KEY_PREFIX=${USER_SERVICE_SESSION_KEY_PREFIX:-user:session}
      - USER_SERVICE_SESSION_MAX_SESSIONS=${USER_SERVICE_SESSION_MAX_SESSIONS:-5}
      - USER_SERVICE_SESSION_TTL=${USER_SERVICE_SESSION_TTL:-168h}
      - USER_SERVICE_SESSION_USER_SESSIONS_PREFIX=${USER_SERVICE_SESSION_USER_SESSIONS_PREFIX:-user:user_sessions}
      - USER_SERVICE_VAR=${USER_SERVICE_VAR:-}
    ports:
      - "${HOST_GRPC_PORT:-19094}:19094"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=127.0.0.1:19094", "-connect-timeout=2s"]
      interval: ${HEALTHCHECK_INTERVAL:-10s}
      timeout: ${HEALTHCHECK_TIMEOUT:-3s}
      retries: ${HEALTHCHECK_RETRIES:-6}
      start_period: ${HEALTHCHECK_START_PERIOD:-10s}

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    environment:
      - POSTGRES_DB=${USER_SERVICE_DATABASE_DBNAME:-user_service}
      - POSTGRES_USER=${USER_SERVICE_DATABASE_USER:-postgres}
      - POSTGRES_PASSWORD=${USER_SERVICE_DATABASE_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USER_SERVICE_DATABASE_USER:-postgres}"]
      interval: ${POSTGRES_HEALTHCHECK_INTERVAL:-3s}
      timeout: ${POSTGRES_HEALTHCHECK_TIMEOUT:-3s}
      retries: ${POSTGRES_HEALTHCHECK_RETRIES:-20}
      start_period: ${POSTGRES_HEALTHCHECK_START_PERIOD:-10s}


  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: ${REDIS_HEALTHCHECK_INTERVAL:-3s}
      timeout: ${REDIS_HEALTHCHECK_TIMEOUT:-3s}
      retries: ${REDIS_HEALTHCHECK_RETRIES:-20}
      start_period: ${REDIS_HEALTHCHECK_START_PERIOD:-3s}

volumes:
  pgdata:
    name: ${POSTGRES_VOLUME:-user-service-pgdata}
  redisdata:
    name: ${REDIS_VOLUME:-user-service-redisdata}
