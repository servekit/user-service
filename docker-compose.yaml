      - USER_SERVICE_DATABASE_USER=${USER_SERVICE_DATABASE_USER:-postgres}
      - USER_SERVICE_DATABASE_PASSWORD=${USER_SERVICE_DATABASE_PASSWORD:-postgres}
      - USER_SERVICE_DATABASE_DBNAME=${USER_SERVICE_DATABASE_DBNAME:-user_service}
      - USER_SERVICE_DATABASE_SSLMODE=${USER_SERVICE_DATABASE_SSLMODE:-disable}
      - USER_SERVICE_REDIS_ADDR=${USER_SERVICE_REDIS_ADDR:-redis:6379}
      - USER_SERVICE_REDIS_USERNAME=${USER_SERVICE_REDIS_USERNAME:-}
      - USER_SERVICE_REDIS_PASSWORD=${USER_SERVICE_REDIS_PASSWORD:-}
