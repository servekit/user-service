      - USER_SERVICE_DB_USER=${USER_SERVICE_DB_USER:-postgres}
      - USER_SERVICE_GID_MACHINE_ID=${USER_SERVICE_GID_MACHINE_ID:-1}
      - USER_SERVICE_GID_MODE=${USER_SERVICE_GID_MODE:-module}
      - USER_SERVICE_GID_START_TIME=${USER_SERVICE_GID_START_TIME:-2024-01-01T00:00:00Z}
      - USER_SERVICE_GID_TARGET=${USER_SERVICE_GID_TARGET:-}
      - USER_SERVICE_LOG_FORMAT=${USER_SERVICE_LOG_FORMAT:-json}
      - USER_SERVICE_MESSAGE_MODE=${USER_SERVICE_MESSAGE_MODE:-grpc}
