      - USER_SERVICE_OAUTH_GOOGLE_CLIENT_SECRET=${USER_SERVICE_OAUTH_GOOGLE_CLIENT_SECRET:-}
      - USER_SERVICE_OAUTH_GOOGLE_REDIRECT_URL=${USER_SERVICE_OAUTH_GOOGLE_REDIRECT_URL:-https://auth.corp.com/oauth/callback}
      - USER_SERVICE_OAUTH_WECHAT_ALLOWED_REDIRECT_URLS=${USER_SERVICE_OAUTH_WECHAT_ALLOWED_REDIRECT_URLS:-https://app.corp.com/auth/done,https://admin.corp.com/auth/done}
      - USER_SERVICE_OAUTH_WECHAT_ALLOW_ARBITRARY_REDIRECT_URLS=${USER_SERVICE_OAUTH_WECHAT_ALLOW_ARBITRARY_REDIRECT_URLS:-}
