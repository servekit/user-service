      - USER_SERVICE_CAPTCHA_REGISTER_WINDOW=${USER_SERVICE_CAPTCHA_REGISTER_WINDOW:-}
      - USER_SERVICE_CRON_TIMEZONE=${USER_SERVICE_CRON_TIMEZONE:-}
      - USER_SERVICE_DB_CONN_MAX_LIFETIME=${USER_SERVICE_DB_CONN_MAX_LIFETIME:-5m}
      - USER_SERVICE_DB_DISABLE_FK=${USER_SERVICE_DB_DISABLE_FK:-true}
      - USER_SERVICE_DB_DRIVER=${USER_SERVICE_DB_DRIVER:-postgres}
      - USER_SERVICE_DB_HOST=${USER_SERVICE_DB_HOST:-127.0.0.1}
      - USER_SERVICE_DB_LOG_LEVEL=${USER_SERVICE_DB_LOG_LEVEL:-warn}
      - USER_SERVICE_DB_MAX_IDLE_CONNS=${USER_SERVICE_DB_MAX_IDLE_CONNS:-10}
      - USER_SERVICE_DB_MAX_OPEN_CONNS=${USER_SERVICE_DB_MAX_OPEN_CONNS:-25}
      - USER_SERVICE_DB_NAME=${USER_SERVICE_DB_NAME:-user_service}
