  int32 total = 3;
}

message LoginLog {
  int64 id = 1;
  int64 user_id = 2;
  IdentityProvider provider = 3;
  LoginAction action = 4;
  bool success = 5;
  string fail_reason = 6;
  string ip = 7;
  DeviceType device_type = 8;
  string os = 9;
  string browser = 10;
  string country = 11;
  string city = 12;
  google.protobuf.Timestamp created_at = 13;
}

