# user-service configuration template.
#
# All values are ${USER_SERVICE_VAR} references resolved from the environment at load time
# (see pkg/config/config.go -> configx.WithExpandEnv). Copy to config.yaml for
# local dev; set the actual values in .env (see .env.example).
#
# Real secrets (DB password, OAuth client secrets, Redis password) must never
# be committed — keep them in .env (gitignored).

server:
  grpc: ${USER_SERVICE_SERVER_GRPC}

database:
  driver: ${USER_SERVICE_DB_DRIVER}        # postgres | mysql | sqlite(空默认 postgres)
  # docker-compose 只跑 postgres;切 mysql/sqlite 时本地编辑 config.yaml 对应块
  postgres:
    host: ${USER_SERVICE_DB_HOST}
    port: ${USER_SERVICE_DB_PORT}
    user: ${USER_SERVICE_DB_USER}
    password: ${USER_SERVICE_DB_PASSWORD}
    dbname: ${USER_SERVICE_DB_NAME}
    sslmode: ${USER_SERVICE_DB_SSLMODE}
    # schema: ${USER_SERVICE_DB_SCHEMA}    # 可选 search_path
  max_open_conns: ${USER_SERVICE_DB_MAX_OPEN_CONNS}
  max_idle_conns: ${USER_SERVICE_DB_MAX_IDLE_CONNS}
  conn_max_lifetime: ${USER_SERVICE_DB_CONN_MAX_LIFETIME}
  # GORM options
  log_level: ${USER_SERVICE_DB_LOG_LEVEL}              # silent, error, warn, info
  slow_threshold: ${USER_SERVICE_DB_SLOW_THRESHOLD}    # slow query warning threshold
  skip_default_tx: ${USER_SERVICE_DB_SKIP_DEFAULT_TX}  # skip implicit transaction for single ops (recommended for production)
  disable_fk: ${USER_SERVICE_DB_DISABLE_FK}            # disable foreign key constraints in migration
  # prefix for all table names; migration scripts must use matching names
  table_prefix: ${USER_SERVICE_DB_TABLE_PREFIX}

redis:
  addr: ${USER_SERVICE_REDIS_ADDR}
  password: ${USER_SERVICE_REDIS_PASSWORD}
  db: ${USER_SERVICE_REDIS_DB}

# Captcha (verification codes) — OPTIONAL. When this block is omitted,
# user-service falls back to a built-in default: prefix "captcha", 3 wrong
# attempts, and 5 codes / 5 min per target across all six purposes, with the
# shortest rate window (5 min) as the code TTL. Uncomment this block AND the
# USER_SERVICE_CAPTCHA_* vars in .env.example together to override.
#
# Purpose keys are readable aliases mapped to the VerificationPurpose enum at
# config load (register/login/verify_email/verify_phone/password_reset/bind);
# raw numeric keys ("1".."6") are also accepted. Redis is the top-level shared
# client (injected via option), so there is no redis: sub-block here.
#
# code_format is optional per purpose — omit it to use the 6-digit numeric
# default (FormatDigit6). Fields: length (int); charset (digit|alpha|
# alphanumeric); case (upper|lower|mixed, ignored when charset=digit). Shown
# under register below; the other purposes omit it and inherit the default.
#
# global_rules (optional) applies on top of each purpose's own rate_rules.
# captcha:
#   prefix: ${USER_SERVICE_CAPTCHA_PREFIX}
#   max_attempts: ${USER_SERVICE_CAPTCHA_MAX_ATTEMPTS}
#   # global_rules:
#   #   - window: 5m
#   #     max: 100
#   purposes:
#     register:        # VERIFICATION_PURPOSE_REGISTER
#       code_format:
#         length: 6
#         charset: digit
#         case: mixed
#       rate_rules:
#         - window: ${USER_SERVICE_CAPTCHA_REGISTER_WINDOW}
#           max: ${USER_SERVICE_CAPTCHA_REGISTER_MAX}
#     login:           # VERIFICATION_PURPOSE_LOGIN
#       rate_rules:
#         - window: ${USER_SERVICE_CAPTCHA_LOGIN_WINDOW}
#           max: ${USER_SERVICE_CAPTCHA_LOGIN_MAX}
#     verify_email:    # VERIFICATION_PURPOSE_VERIFY_EMAIL
#       rate_rules:
#         - window: ${USER_SERVICE_CAPTCHA_VERIFY_EMAIL_WINDOW}
#           max: ${USER_SERVICE_CAPTCHA_VERIFY_EMAIL_MAX}
#     verify_phone:    # VERIFICATION_PURPOSE_VERIFY_PHONE
#       rate_rules:
#         - window: ${USER_SERVICE_CAPTCHA_VERIFY_PHONE_WINDOW}
#           max: ${USER_SERVICE_CAPTCHA_VERIFY_PHONE_MAX}
#     password_reset:  # VERIFICATION_PURPOSE_PASSWORD_RESET
#       rate_rules:
#         - window: ${USER_SERVICE_CAPTCHA_PASSWORD_RESET_WINDOW}
#           max: ${USER_SERVICE_CAPTCHA_PASSWORD_RESET_MAX}
#     bind:            # VERIFICATION_PURPOSE_BIND
#       rate_rules:
#         - window: ${USER_SERVICE_CAPTCHA_BIND_WINDOW}
#           max: ${USER_SERVICE_CAPTCHA_BIND_MAX}

session:
  ttl: ${USER_SERVICE_SESSION_TTL}
  # max concurrent sessions per user, 0 = unlimited
  max_sessions: ${USER_SERVICE_SESSION_MAX_SESSIONS}
  key_prefix: ${USER_SERVICE_SESSION_KEY_PREFIX}
  user_sessions_prefix: ${USER_SERVICE_SESSION_USER_SESSIONS_PREFIX}
  # one-time short code TTL for IssueSessionCode (OAuth callback handoff)
  session_code_ttl: ${USER_SERVICE_SESSION_CODE_TTL}

rbac:
  cache:
    user_perms_ttl: ${USER_SERVICE_RBAC_USER_PERMS_TTL}
    user_roles_ttl: ${USER_SERVICE_RBAC_USER_ROLES_TTL}
    role_perms_ttl: ${USER_SERVICE_RBAC_ROLE_PERMS_TTL}
    group_roles_ttl: ${USER_SERVICE_RBAC_GROUP_ROLES_TTL}
    group_user_perms_ttl: ${USER_SERVICE_RBAC_GROUP_USER_PERMS_TTL}
  user_perms_prefix: ${USER_SERVICE_RBAC_USER_PERMS_PREFIX}
  user_roles_prefix: ${USER_SERVICE_RBAC_USER_ROLES_PREFIX}
  role_perms_prefix: ${USER_SERVICE_RBAC_ROLE_PERMS_PREFIX}
  group_roles_prefix: ${USER_SERVICE_RBAC_GROUP_ROLES_PREFIX}
  group_user_perms_prefix: ${USER_SERVICE_RBAC_GROUP_USER_PERMS_PREFIX}

oauth:
  # ──────────────────────────────────────────────────────────────────────
  # 重要:每个 provider 的 redirect_url 必须与 OAuth 提供方后台注册的值
  # **精确匹配**,包括:
  #   - scheme(https vs http)
  #   - host(域名)
  #   - path(包括末尾斜杠)
  # 不匹配会导致 OAuth 提供方报 "redirect_uri mismatch"。常见踩坑:
  #   ✗ 末尾多斜杠:  https://auth.corp.com/callback/
  #   ✗ http vs https: http://auth.corp.com/callback
  #   ✗ 端口写错:    https://auth.corp.com:443/callback
  # user-service 在 New() 时会做格式校验(scheme/host/URL 解析),但
  # 没法知道 provider 那边注册了什么 —— 责任在配置的人。
  # ──────────────────────────────────────────────────────────────────────
  github:
    client_id: ${USER_SERVICE_OAUTH_GITHUB_CLIENT_ID}
    client_secret: ${USER_SERVICE_OAUTH_GITHUB_CLIENT_SECRET}
    # OAuth 提供方后台注册的固定回调 URL,属于"统一回调服务"(独立 HTTP 服务),
    # 不属于任何业务方。多业务共用一个 OAuth App 时所有业务的 OAuth 流程都走这个 URL。
    redirect_url: ${USER_SERVICE_OAUTH_GITHUB_REDIRECT_URL}
    # 业务方 return_to 白名单(精确匹配)。空 + 非空 return_to → 直接拒绝。
    # Comma-separated list (configx StringToSlice splits on ",").
    allowed_redirect_urls: ${USER_SERVICE_OAUTH_GITHUB_ALLOWED_REDIRECT_URLS}
    # 逃生舱:允许任意 return_to(**仅** dev/staging 用)。
    # 生产环境**绝不**开启 —— 会让 XSS 通过 return_to 绕过白名单。
    # allow_arbitrary_redirect_urls: ${USER_SERVICE_OAUTH_GITHUB_ALLOW_ARBITRARY_REDIRECT_URLS}
  google:
    client_id: ${USER_SERVICE_OAUTH_GOOGLE_CLIENT_ID}
    client_secret: ${USER_SERVICE_OAUTH_GOOGLE_CLIENT_SECRET}
    redirect_url: ${USER_SERVICE_OAUTH_GOOGLE_REDIRECT_URL}
    allowed_redirect_urls: ${USER_SERVICE_OAUTH_GOOGLE_ALLOWED_REDIRECT_URLS}
    # allow_arbitrary_redirect_urls: ${USER_SERVICE_OAUTH_GOOGLE_ALLOW_ARBITRARY_REDIRECT_URLS}  # NEVER enable in prod
  wechat:
    app_id: ${USER_SERVICE_OAUTH_WECHAT_APP_ID}
    app_secret: ${USER_SERVICE_OAUTH_WECHAT_APP_SECRET}
    redirect_url: ${USER_SERVICE_OAUTH_WECHAT_REDIRECT_URL}
    allowed_redirect_urls: ${USER_SERVICE_OAUTH_WECHAT_ALLOWED_REDIRECT_URLS}
    # allow_arbitrary_redirect_urls: ${USER_SERVICE_OAUTH_WECHAT_ALLOW_ARBITRARY_REDIRECT_URLS}  # NEVER enable in prod
  apple:
    client_id: ${USER_SERVICE_OAUTH_APPLE_CLIENT_ID}
    team_id: ${USER_SERVICE_OAUTH_APPLE_TEAM_ID}
    key_id: ${USER_SERVICE_OAUTH_APPLE_KEY_ID}
    private_key: ${USER_SERVICE_OAUTH_APPLE_PRIVATE_KEY}
    redirect_url: ${USER_SERVICE_OAUTH_APPLE_REDIRECT_URL}
    allowed_redirect_urls: ${USER_SERVICE_OAUTH_APPLE_ALLOWED_REDIRECT_URLS}
    # allow_arbitrary_redirect_urls: ${USER_SERVICE_OAUTH_APPLE_ALLOW_ARBITRARY_REDIRECT_URLS}  # NEVER enable in prod
    client_secret_ttl: ${USER_SERVICE_OAUTH_APPLE_CLIENT_SECRET_TTL}

third_party:
  gid:
    mode: ${USER_SERVICE_GID_MODE}          # module | grpc
    target: ${USER_SERVICE_GID_TARGET}      # gRPC addr when mode=grpc, e.g. "localhost:19091"
    config:                    # required when mode=module — full gid-service config
      snowflake:
        machine_id: ${USER_SERVICE_GID_MACHINE_ID}  # must be unique per node
        # snowflake epoch — DO NOT change after deployment
        start_time: ${USER_SERVICE_GID_START_TIME}
  message:
    mode: ${USER_SERVICE_MESSAGE_MODE}      # module | grpc
    target: ${USER_SERVICE_MESSAGE_TARGET}  # gRPC addr when mode=grpc
    # config:                   # required when mode=module — full message-service config

# Rate limiting, organized by purpose.
# rate_limit:
#   login:
#     prefix: ${USER_SERVICE_RATE_LIMIT_LOGIN_PREFIX}
#     global:
#       - window: ${USER_SERVICE_RATE_LIMIT_LOGIN_GLOBAL_WINDOW}
#         max: ${USER_SERVICE_RATE_LIMIT_LOGIN_GLOBAL_MAX}

# Cron scheduler settings. Per-task specs live in their owning domain config.
# cron:
#   timezone: ${USER_SERVICE_CRON_TIMEZONE}

log:
  level: ${USER_SERVICE_LOG_LEVEL}
  format: ${USER_SERVICE_LOG_FORMAT}
